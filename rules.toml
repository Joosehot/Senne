variants.plain = { safety = 0.6, brevity = 0.9, perf = 0.7 }
variants.atomic = { safety = 1.0, brevity = 0.3, perf = 0.5 }

[rules.env_var]
weight = 1.0
variants.var = { safety = 0.8, brevity = 0.8, perf = 0.8 }

[rules.parse_number]
weight = 1.0
variants.parse = { safety = 0.8, brevity = 0.8, perf = 0.8 }

[rules.create_dir]
weight = 1.0
variants.create_dir_all = { safety = 0.8, brevity = 0.8, perf = 0.8 }

[rules.list_dir]
weight = 1.0
variants.read_dir = { safety = 0.8, brevity = 0.6, perf = 0.6 }

[rules.for_each]
weight = 1.0
variants.for_loop = { safety = 0.8, brevity = 0.8, perf = 0.6 }

[rules.parallel]
weight = 1.0
variants.scoped_fixed = { safety = 0.8, brevity = 0.4, perf = 0.9 }
variants.scoped_auto = { safety = 0.8, brevity = 0.3, perf = 1.0 }

[rules.sum]
weight = 1.0
variants.iter_sum = { safety = 0.7, brevity = 0.9, perf = 0.9 }

[rules.count]
weight = 1.0
variants.len = { safety = 0.9, brevity = 0.9, perf = 0.9 }

[rules.sort]
weight = 1.0
variants.stable = { safety = 0.9, brevity = 0.8, perf = 0.7 }
variants.unstable = { safety = 0.8, brevity = 0.8, perf = 0.9 }

[rules.dedupe]
weight = 1.0
variants.sorted_dedup = { safety = 1.0, brevity = 1.0, perf = 1.0 }   # only right after a sort
variants.keep_order = { safety = 1.0, brevity = 0.4, perf = 0.6 }
variants.sort_dedup = { safety = 0.4, brevity = 0.8, perf = 0.9 }     # reorders

[rules.skip_blank]
weight = 1.0
variants.filter = { safety = 0.8, brevity = 0.8, perf = 0.8 }

[rules.trim]
weight = 1.0
variants.trim = { safety = 0.8, brevity = 0.8, perf = 0.8 }

[rules.print]
weight = 1.0
variants.display = { safety = 0.8, brevity = 0.7, perf = 0.7 }
variants.each_line = { safety = 0.8, brevity = 0.5, perf = 0.6 }
variants.debug = { safety = 0.4, brevity = 0.9, perf = 0.8 }

[rules.log]
weight = 1.0
variants.eprintln = { safety = 0.8, brevity = 0.8, perf = 0.8 }

[rules.wait]
weight = 1.0
variants.sleep = { safety = 0.8, brevity = 0.8, perf = 0.8 }

[rules.retry_helper]        # "retry this ..." with nothing to retry: emit the helper itself
weight = 1.0
variants.helper = { safety = 0.8, brevity = 0.8, perf = 0.8 }

# ==== Game domain (senne::game) ================================================
# The same idea for game code: every code-level choice has safety / brevity /
# perf axes, the profile is [game.profile] shifted by the sentence's modifiers
# ([modifiers] above), and judges score choices across the whole game.
# [game.tuning] holds every constant the generated game code uses; pattern
# code only names these keys. Unknown keys, patterns or variants are errors.

[game.profile]
safety = 1.0
brevity = 0.6
perf = 0.4

[game.tuning]
smoothing_rate = 12.0       # "smoothly": velocity eases toward the target (1/s)
jump_buffer = 0.12          # buffered jump: a press this early before landing still jumps (s)
coyote_time = 0.1           # buffered jump: still jump this long after leaving the ground (s)
jump_release_gravity = 40.0 # "higher while held": extra fall while rising without the key (u/s^2)
walk_speed = 0.1            # "while it walks": this fast counts as walking (u/s)
shot_cooldown = 0.25        # player shots without "every N seconds" (s)
shot_size = 0.4             # projectile size (u)
shot_offset = 0.8           # projectiles start this far from the shooter (u)
projectile_range = 40.0     # projectiles farther than this from the player are removed (u)
stomp_height = 0.25         # "lands on": player centre this far above the other's (u)
squash_amount = 0.3         # "squash it"
chase_dead_zone = 0.1       # sideways chasers stop inside this x distance (u)
wander_jitter = 0.5         # own wander timers wait turn x (1 +- jitter)
safe_seconds = 1.0          # "loses a life" without "safe for N seconds" (s)
lives = 3                   # "loses a life" without "the player has N lives"
blink_rate = 12.0           # blinks per second while safe
blink_dim = 0.35            # brightness on the dark half of a blink
music_bpm = 120.0           # "play the music" without a tempo
music_wave = "square"       # "play the music" without a wave
hud_size = 24.0             # HUD text size (px)
banner_size = 44.0          # win/lose banner size (px)
line_gap = 0.05             # HUD lines at the same place stack this far apart (screen fraction)
top_left = [0.02, 0.03]     # text places (fractions of the screen from the top left)
top_right = [0.78, 0.03]
top = [0.42, 0.03]
middle = [0.36, 0.45]
bottom = [0.40, 0.92]
banner = [0.30, 0.40]
shout_threshold = 0.25      # "while the player shouts": voice (0..1) at or above this is a shout
line_width = 0.06           # "hangs on a line": thickness (u)
line_color = [0.92, 0.92, 0.88]
line_depth = -0.1           # the line is drawn behind the hook (z)
hooked_drop = 0.7           # a hooked thing hangs this far below its hook (u)
land_margin = 0.3           # "a hooked X reaches the Y": within this height of it (u)
side_x = 18.0               # "comes in from the side": appears this far left or right (u), past the screen edge
meter_label = "SHOUT!"      # "the shout meter": the label above the bar
meter_size = [0.34, 0.06]   # ... the bar: a third of the screen wide (screen fractions)
meter_border = 0.006        # ... its frame (screen fraction)
meter_label_size = 34.0     # ... the label (px)
meter_back = [0.05, 0.09, 0.15]  # ... behind the fill
meter_frame = [0.85, 0.92, 1.0]
meter_low = [0.3, 0.9, 0.35]     # ... the fill: green when quiet ...
meter_mid = [1.0, 0.85, 0.2]     # ... yellow at the shout threshold ...
meter_high = [1.0, 0.3, 0.25]    # ... red at full voice
meter_mark = [1.0, 1.0, 1.0]     # ... a line where a shout starts to count
meter_pulse = 2.5           # ... the frame and label pulse this many times a second while a fish is on
line_spring = 6.0           # a hook pulled sideways springs back under the hole (1/s)
burst_secs = 0.9            # "in bursts": pull this long ...
rest_secs = 0.7             # ... then rest this long (s): a shout in the rest gains ground
thrash_width = 0.45         # "fighting": darts this far to each side (u)
thrash_rate = 2.5           # ... this many times a second
rest_thrash = 0.3           # ... at this fraction while resting
hook_jerk = 0.6             # ... and jerks the hook sideways by this fraction of the dart
bottom_margin = 0.2         # "stays at the bottom": within this height of the hook's lowest point (u)
shy_secs = 3.0              # "it gets away": won't bite again for this long (s)
flash_size = 36.0           # "show ... for N seconds": message size (px)
swim_clock_jitter = 0.3     # "swims ...": each fish's own clock runs 1 +- this/2 as fast (seeded by its name)
swim_turn_rate = 6.0        # ... its velocity eases to the target at this rate (1/s)
swim_smooth_turn = 1.2      # ... and at this rate "turning smoothly": slows down before a turn
face_speed = 0.15           # ... it faces left or right once it moves this fast that way (u/s)
dart_cycle = 1.8            # "darting": a burst every this many seconds ...
dart_secs = 0.35            # ... lasting this long (s) ...
dart_boost = 2.6            # ... at this many times the speed ...
dart_rate = 9.0             # ... reached at this rate (1/s), then a glide slowing at ...
glide_rate = 2.2            # ... this rate (1/s) into a short pause
dart_turn_chance = 0.3      # ... and at a burst it turns with this chance
drift_swing = 0.25          # "drifting": the speed swells by this fraction ...
drift_rate = 0.6            # ... at this rate (rad/s)
lurk_low = 0.1              # "lurking": hovers at this fraction of the speed at the least ...
lurk_rate = 0.8             # ... the fins beating at this rate (rad/s) ...
lurk_turn_secs = 5.0        # ... and every this many seconds ...
lurk_turn_chance = 0.3      # ... it turns with this chance
depth_share = 0.7           # "keeping its depth": drifts over this fraction of the band ...
depth_rate = 0.35           # ... at this rate (rad/s) ...
depth_follow = 1.2          # ... its height following the target at this rate (1/s)
swim_wave_rate = 0.25       # "in a wave N units high": cycles per second
school_radius = 5.0         # "in a school": others this near count (u) ...
school_spacing = 1.6        # ... closer than this pushes apart (u) ...
school_pull = 0.35          # ... closing in at this rate (1/s) ...
school_push = 1.5           # ... pushed apart at this rate (1/s)
nose_speed = 0.5            # "nosing toward": at this fraction of the speed ...
nose_ease = 1.5             # ... slowing within reach at this rate (1/s)
lunge_secs = 0.7            # "lunging at": the dash lasts this long (s) ...
lunge_rest = 2.5            # ... and the next can come this long after it (s)
jig_lift_secs = 0.12        # "jigs ... lifting it N units": the twitch rises over this long (s) ...
jig_secs = 2.5              # ... and the hook counts as jigged this long after a twitch (s)
flutter_sway = 0.12         # "it flutters back down": sways this far to each side (u) ...
flutter_rate = 2.2          # ... this many times a second, fading over the jigged time
draw_ease = 1.0             # "drawn to a jigged hook": a fish slows down within this of it (u)
jig_settle_secs = 0.5       # "jigs ...": with nothing sinking it, the hook settles back to its resting depth this fast (s)
bite_steady = 1.6           # "bites with a chance ... more for a steady rhythm": x this ...
rhythm_min = 0.35           # ... when the jig comes this many seconds after the last one or more ...
rhythm_max = 1.2            # ... but no more than this ...
rhythm_slack = 0.25         # ... and within this of the gap before (s)
bite_frantic = 0.15         # "less for frantic jigging": x this ...
frantic_secs = 0.3          # ... when the jig comes sooner than this after the last one (s)
choose_at = [0.27, 0.3]     # "The player chooses easy, normal or hard ...": the prompt (screen fractions) ...
choose_size = 40.0          # ... and its size (px)
level_pull = [0.6, 1.0, 1.35]    # "the harder the game": easy, normal, hard x the pull ("the stronger the fish pull") ...
level_burst = [0.75, 1.0, 1.25]  # ... x the burst_secs of the pull ...
level_bite = [1.4, 1.0, 0.7]     # ... x the bite chance ("the less they bite") ...
level_shout = [0.6, 1.0, 1.4]    # ... x the shout_threshold ("the louder the shout must be") ...
level_escape = [1.6, 1.0, 0.65]  # ... x the time at the bottom before it gets away ("the sooner they get away") ...
level_time = [1.33333, 1.0, 0.77778]  # ... x the time ("the shorter the time"): 90 s -> 120, 90, 70

# ---- Game judges ---------------------------------------------------------------

[game.judges.helper_reuse]  # win/lose/hurt: a helper used once, the same block inlined twice, or mixing
weight = 0.3
breakable = false
discount = 0.0

[game.judges.hoist_reuse]   # player position read once per frame pays from two loops; mixing costs
weight = 0.3
breakable = false
discount = 0.0


[package]
name = "senne"
version = "0.1.0"
edition = "2021"
description = "Deterministic natural-language-to-Rust engine: lexicon + hand-crafted patterns + beam search"
license-file = "LICENSE"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "senne"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
